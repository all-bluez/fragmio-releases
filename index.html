<!-- Colours and light/dark before the page draws, so it never flashes. -->
<script>(function(){var r=document.documentElement,t,p;try{t=localStorage.getItem('fr-theme');p=localStorage.getItem('fr-palette')}catch(e){}r.dataset.theme=t||'dark';r.dataset.pal=p||'berry'})()</script>
</head>
<body>
<div id="root"></div>
<noscript><p style="padding:24px;font-family:system-ui">Fragmio's website needs JavaScript. You can also download Fragmio from <a href="https://github.com/all-bluez/fragmio-releases/releases/latest">GitHub</a>.</p></noscript>
